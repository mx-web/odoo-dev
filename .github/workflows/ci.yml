name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck odev entrypoint.sh
      - name: compose config
        run: cp .env.example .env && docker compose config --quiet

  smoke:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: build and init
        run: |
          chmod o+w backups addons
          ./odev build
          ./odev init
          ./odev up
      - name: wait for health
        run: |
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8069/web/health && exit 0
            sleep 5
          done
          ./odev logs
          exit 1
      - name: backup and restore
        run: |
          ./odev backup
          ./odev restore "$(ls -t backups/*.zip | head -1)" restored
      - name: teardown
        if: always()
        run: ./odev down -v
